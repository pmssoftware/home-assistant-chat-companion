name: Home Assistant Chat Companion
version: "0.3.1"
slug: home_assistant_chat_companion
description: >-
  Experimental federation and native-client companion server for Home Assistant Chat.
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
stage: experimental
backup: cold
tmpfs: true
ports:
  8210/tcp: 8210
  8211/tcp: 8211
ports_description:
  8210/tcp: Native/local client API (do not use the Home Assistant UI port)
  8211/tcp: Server-to-server federation API
map:
  - type: ssl
    read_only: true
options:
  bootstrap_admin_name: Owner
  bootstrap_admin_password: null
  ssl: true
  allow_insecure_test_http: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  log_level: info
  federation_peers: []
schema:
  bootstrap_admin_name: str(1,80)
  bootstrap_admin_password: password
  ssl: bool
  allow_insecure_test_http: bool
  certfile: str
  keyfile: str
  log_level: list(debug|info|warning|error)
  federation_peers:
    - peer_id: str
      address: str
      port: port
      shared_secret: password
      insecure_http: bool
      tls_server_name: str?
